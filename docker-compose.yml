services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storageblox
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storageblox.rule=Host(`blox.himmelreich.cloud`)"
      - "traefik.http.routers.storageblox.entrypoints=web"
      - "traefik.http.services.storageblox.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
